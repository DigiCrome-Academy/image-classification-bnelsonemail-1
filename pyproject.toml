[project]
name = "04-image-classification"
version = "0.1.0"
description = "Short description of your project"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "dvc[gdrive]>=3.0.0",
    "tensorflow>=2.12.0",
    "numpy>=1.23.0",
    "pandas>=1.5.0",
    "matplotlib>=3.6.0",
    "seaborn>=0.12.0",
    "scikit-learn>=1.2.0",
    "opencv-python>=4.7.0",
    "Pillow>=9.4.0",
    "kaggle>=1.5.13",
    "tqdm>=4.65.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.2.0",
    "pytest-cov>=4.0.0"
]

[tool.pytest.ini_options]
addopts = "--cov --cov-report=term-missing" # comment out this line if passing locally but failing in repo
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"